apiVersion: v1
kind: ServiceAccount
metadata:
  name: nextflow-runner
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nextflow-runner
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "events"]
  verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nextflow-runner
  namespace: default
subjects:
- kind: ServiceAccount
  name: nextflow-runner
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nextflow-runner
---
apiVersion: v1
kind: Pod
metadata:
  name: bindflow-launcher
  namespace: default
spec:
  serviceAccountName: nextflow-runner
  restartPolicy: Never
  containers:
  - name: launcher
    image: nextflow/nextflow:25.10.4
    command: ["/bin/bash", "-lc", "sleep infinity"]
    env:
    - name: NXF_HOME
      value: /workspace/.nextflow
    volumeMounts:
    - name: work
      mountPath: /workspace
  volumes:
  - name: work
    persistentVolumeClaim:
      claimName: bindflow-rwo
